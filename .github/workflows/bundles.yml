name: Build desktop bundles

# Run by hand to get the bundles as workflow artifacts, or push a `v*` tag
# matching the app version to also put them on a draft release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: deb
            cli: worldline-cli
          - os: windows-latest
            target: nsis
            cli: worldline-cli.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - if: startsWith(github.ref, 'refs/tags/')
        name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./gui/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version v$version"
            exit 1
          fi

      - if: runner.os == 'Linux'
        name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: gui/package.json

      - name: Install GUI dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      # The checked-in manifest is an empty placeholder; ship the real one as
      # the offline fallback for game discovery.
      - name: Fetch the Ludusavi manifest
        shell: bash
        run: curl -fsSL --retry 3 -o worldline-core/assets/manifest.yaml https://raw.githubusercontent.com/mtkennerly/ludusavi-manifest/master/data/manifest.yaml

      - name: Build bundle
        working-directory: gui
        run: bun run bundle --bundles ${{ matrix.target }}

      - name: Collect release files
        shell: bash
        run: |
          mkdir dist
          find target/release/bundle/${{ matrix.target }} -maxdepth 1 -type f \( -name '*.deb' -o -name '*.exe' \) -exec cp {} dist/ \;
          cp target/release/${{ matrix.cli }} dist/

      - uses: actions/upload-artifact@v4
        with:
          name: worldline-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Versions like 1.0.0-rc1 are marked as pre-releases.
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
