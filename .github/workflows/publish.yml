name: Publish

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    permissions: 
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''
            
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v5

    - name: Install and cache APT pkg deps (Ubuntu only)
      if: matrix.platform == 'ubuntu-latest'
      uses: awalsh128/cache-apt-pkgs-action@v1.6.0
      with:
        packages: |
          libwebkit2gtk-4.1-dev
          build-essential
          curl
          wget
          file
          libxdo-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev

    - name: Restore cached dirs
      id: ci-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          gui/node_modules
          gui/dist
        key: ci-cache-${{ runner.os }}
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      
    - run: cd gui && bun install

    - uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
        releaseName: 'v__VERSION__'
        releaseBody: 'See the assets to download this version and install.'
        releaseDraft: true
        prerelease: false
        projectPath: './gui'
        args: ${{ matrix.args }}

    - name: Build CLI (Windows only)
      if: matrix.platform == 'windows-latest'
      run: cargo build --release -p cli

    - name: Upload CLI to release (Windows only)
      if: matrix.platform == 'windows-latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload ${{ github.event.workflow_run.head_branch }} target/release/cli.exe --clobber

    - name: Save cache
      id: ci-cache-save
      uses: actions/cache/save@v4
      with:
        path: |
          gui/node_modules
          gui/dist
        key: ${{ steps.ci-cache-restore.outputs.cache-primary-key }}
