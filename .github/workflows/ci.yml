name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths-ignore:
      - 'website/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Run full cross-platform checks for a release tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Full debug info fills the Linux runner's disk before the cache is saved.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Routine CI avoids the Tauri build and Windows runner.
        os: ${{ fromJSON(inputs.release && startsWith(github.ref, 'refs/tags/v') && '["ubuntu-24.04", "windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - if: inputs.release && startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ inputs.release && 'release-check' || 'quick-check' }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: gui/package.json

      - name: Cache Bun packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('gui/bun.lockb', 'gui/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install GUI dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        shell: bash
        env:
          RELEASE_CHECK: ${{ inputs.release && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$RELEASE_CHECK" = "true" ]; then
            cargo test --workspace --locked
          else
            cargo test -p worldline-core -p cli --locked
          fi

      - name: Run Clippy
        shell: bash
        env:
          RELEASE_CHECK: ${{ inputs.release && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$RELEASE_CHECK" = "true" ]; then
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo clippy -p worldline --all-targets --features e2e --locked -- -D warnings
          else
            cargo clippy -p worldline-core -p cli --all-targets --locked -- -D warnings
          fi

      - name: Check GUI
        working-directory: gui
        run: bun run check

      - name: Run GUI tests
        working-directory: gui
        run: bun run test --run

      - if: inputs.release && startsWith(github.ref, 'refs/tags/v')
        name: Build GUI
        working-directory: gui
        run: bun run build

      - if: runner.os == 'Linux'
        name: Check IPC bindings are up to date
        run: |
          cargo test -p worldline-core --features ts --locked export_bindings
          git status --porcelain -- gui/src/ipc/bindings
          test -z "$(git status --porcelain -- gui/src/ipc/bindings)"

      - if: inputs.release && startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        name: Run screen tests
        working-directory: gui
        run: |
          bunx playwright install --with-deps chromium
          bun run test:screens

      - if: failure() && inputs.release && startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screen-test-results
          path: gui/test-results/
          if-no-files-found: ignore

  e2e:
    if: inputs.release && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 keeps an older WebView2: newer runtimes let Tauri's browser
        # arguments replace msedgedriver's debugging port, so no session starts
        # (actions/runner-images#14738).
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - if: runner.os == 'Linux'
        name: Install Tauri system dependencies and WebKitWebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: e2e

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: gui/package.json

      - name: Install tauri-driver
        shell: bash
        run: command -v tauri-driver >/dev/null || cargo install tauri-driver --locked

      - if: runner.os == 'Windows'
        name: Install an msedgedriver matching WebView2
        shell: bash
        run: |
          command -v msedgedriver-tool >/dev/null || cargo install --locked --git https://github.com/chippers/msedgedriver-tool
          msedgedriver-tool
          echo "TAURI_NATIVE_DRIVER=$(cygpath -w "$PWD")\msedgedriver.exe" >> "$GITHUB_ENV"

      - name: Cache Bun packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('gui/bun.lockb', 'gui/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install GUI dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Build the app with the e2e feature
        working-directory: gui
        run: bun run e2e:build

      - if: runner.os == 'Linux'
        name: Run E2E tests
        working-directory: gui
        # xvfb's default 640x480 screen would fold the sidebar.
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' bun run e2e

      - if: runner.os == 'Windows'
        name: Run E2E tests
        working-directory: gui
        run: bun run e2e
