name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install and cache APT pkg deps
      uses: awalsh128/cache-apt-pkgs-action@v1.6.0
      with:
        packages: |
          libwebkit2gtk-4.1-dev
          build-essential
          curl
          wget
          file
          libxdo-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev

    - name: Restore cached dirs
      id: ci-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
          dist
        key: ci-cache-${{ runner.os }}
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'
      
    - run: bun install
    - run: bun run ci

    - name: Save cache
      id: ci-cache-save
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
          dist
        key: ${{ steps.ci-cache-restore.outputs.cache-primary-key }}
