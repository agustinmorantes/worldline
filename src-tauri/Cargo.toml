[package]
name = "savegame-timeline"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "savegame_timeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2.3.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "serde_json", "chrono", "uuid", "r2d2"] }
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["fast-rng", "macro-diagnostics", "serde", "v7"] }
libsqlite3-sys = { version = "0.35.0", features = ["bundled"] }
dotenvy = "0.15.7"
diesel_migrations = { version = "2.3.0", features = ["sqlite"] }
r2d2 = "0.8.10"
anyhow = "1.0.100"
tauri-plugin-dialog = "2"
notify = { version = "8.2.0", features = ["serde"] }
notify-debouncer-full = { version = "0.6.0", features = ["serde"] }
walkdir = "2.5.0"
fs_extra = "1.3.0"
shellexpand = { version = "3.1.1", features = ["path"] }
