[workspace]
members = ["worldline-core", "gui/src-tauri", "cli"]
resolver = "2"

[profile.dev]
# Full debug info writes a large .pdb for every test binary on Windows; line tables keep backtraces useful.
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
