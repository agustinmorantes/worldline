[package]
name = "worldline"
version = "1.0.0-rc1"
description = "Desktop app for tracking and restoring game save history"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "worldline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
worldline-core = { path = "../../worldline-core" }
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
anyhow = "1.0.100"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"

# The versions Tauri uses, so the WebView2 interface types match.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# The game overlay's Win32 calls and sound.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_Media", "Win32_Media_Audio", "Win32_UI_Shell"] }
# The overlay's hotkeys (O3, O4), registered from Rust only.
tauri-plugin-global-shortcut = "2.4"
# The local time in the hotkeys' automatic tag.
chrono = "0.4"

[features]
# Test build for WebdriverIO: `WORLDLINE_E2E_DATA_DIR` overrides the data directory and
# native dialogs are stubbed (pickers return `WORLDLINE_E2E_DIALOG_PATH`, confirms accept).
e2e = []

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
