[package]
name = "worldline-core"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "chrono", "r2d2"] }
diesel_migrations = "2"
fs_extra = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "webp"] }
notify-debouncer-full = "0.3"
serde = { version = "1", features = ["derive"] }
shellexpand = "3"
log = "0.4"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
ureq = { version = "2.9", features = ["tls"] }
serde_yaml_ng = "0.9"
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
dirs = "5.0"
keyvalues-parser = "0.2"
glob = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
fastcdc = "3"
zstd = "0.14.0"
ts-rs = { version = "12", optional = true, features = ["chrono-impl", "uuid-impl"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[features]
# Exports the GUI-facing types as TypeScript (see `../.cargo/config.toml`).
ts = ["dep:ts-rs"]
# Test builds: no network, so game icons and the Ludusavi manifest are never downloaded.
offline = []

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[build-dependencies]
ureq = { version = "2.9", features = ["tls"] }

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
